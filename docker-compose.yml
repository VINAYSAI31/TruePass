
services:

  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: truepass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./TruePass-backend
      dockerfile: Dockerfile
    image: truepass-backend:1.0
    container_name: truepass-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend with Nginx
  frontend:
    build:
      context: ./TruePass-frontend
      dockerfile: Dockerfile
    image: truepass-frontend:1.0
    container_name: truepass-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

    
  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: truepass-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  # Grafana Monitoring Dashboard
  grafana:
    image: grafana/grafana:12.1.0
    container_name: truepass-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

    # EC2 Host Monitoring
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: truepass-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"

  # Docker Container Monitoring
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: truepass-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    # PostgreSQL Monitoring
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: truepass-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${DB_NAME}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USERNAME}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
