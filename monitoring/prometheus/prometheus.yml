global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "truepass-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8081"]

  - job_name: "truepass-node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "truepass-containers"
    static_configs:
      - targets: ["cadvisor:8080"]
  
  - job_name: "truepass-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]